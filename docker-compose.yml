version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
    ports:
      - "1433:1433"
    networks:
      - mynetwork
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - sql_data:/var/opt/mssql     # <-- هنا الفوليوم الدائم لداتا SQL

  testapp:
    build: .
    container_name: test-connet-sql-inside-docker-container
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - mynetwork
    restart: on-failure
    # لو عايز تحافظ على ملفات لوج أو غيرها تقدر تفعل السطر ده:
    # volumes:
    #   - app_logs:/app/logs

networks:
  mynetwork:
    driver: bridge

volumes:
  sql_data:
  # app_logs:
